version: 2.1

orbs:
  node: circleci/node@5.2.0

jobs:
  build-and-test:
    docker:
      # matches .node-version / package.json engines
      - image: cimg/node:20.11
    steps:
      - checkout
      # runs `npm ci` (the postinstall hook builds src -> dist)
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run unit tests with coverage
          # the suite is fully mocked: no database, network or secrets needed
          command: npm test
      - run:
          name: Upload coverage to Coveralls
          # uses the `coveralls` devDependency; needs COVERALLS_REPO_TOKEN in the
          # CircleCI project environment variables (Project Settings > Environment Variables)
          command: cat ./coverage/lcov.info | npx coveralls

workflows:
  test-my-brand-api:
    jobs:
      - build-and-test
